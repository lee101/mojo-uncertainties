[project]
name = "mojo-uncertainties"
version = "0.1.0"
description = "Error propagation arithmetic implemented with Mojo kernels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "uncertainties", "error-propagation", "scientific-computing"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "uncertainties"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-uncertainties"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
